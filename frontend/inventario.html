<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - LabTrack</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Dashboard Layout -->
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-flask"></i>
                    </div>
                    <span>LabTrack</span>
                </div>
            </div>
            
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <h4 id="nombreUsuario">Cargando...</h4>
                    <p id="correoUsuario">cargando@itsr.edu.mx</p>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <i class="fas fa-tachometer-alt menu-item-icon"></i>
                    <span class="menu-item-text">Dashboard</span>
                </a>
                <a href="inventario.html" class="menu-item active">
                    <i class="fas fa-boxes menu-item-icon"></i>
                    <span class="menu-item-text">Inventario</span>
                </a>
                <a href="prestamos.html" class="menu-item">
                    <i class="fas fa-hand-holding menu-item-icon"></i>
                    <span class="menu-item-text">Préstamos</span>
                </a>
                <a href="mantenimiento.html" class="menu-item">
                    <i class="fas fa-tools menu-item-icon"></i>
                    <span class="menu-item-text">Mantenimiento</span>
                </a>
                <a href="configuracion-admin.html" class="menu-item">
                    <i class="fas fa-cog menu-item-icon"></i>
                    <span class="menu-item-text">Configuración</span>
                </a>
                <a href="#" class="menu-item" style="margin-top: 50px; color: var(--danger);" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt menu-item-icon"></i>
                    <span class="menu-item-text">Cerrar Sesión</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Page Header -->
            <div class="page-header">
                <div>
                    <h1 class="page-title">Gestión de Inventario</h1>
                    <p class="page-subtitle">Administra los equipos y componentes del laboratorio</p>
                </div>
                <button class="add-btn" id="btnAgregarEquipo" onclick="mostrarModalAgregar()">
                    <i class="fas fa-plus"></i>
                    Agregar Nuevo Equipo
                </button>
            </div>

            <!-- Alertas y Spinner -->
            <div id="alerta" style="margin-top: 20px;"></div>
            <div id="spinner" style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-green);"></i>
                <p style="margin-top: 15px; color: var(--text-light);">Cargando inventario...</p>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar equipo por nombre...">
                </div>
                <div class="filters">
                    <select class="filter-select" id="categoryFilter">
                        <option value="all">Todas las categorías</option>
                        <option value="Redes">Redes</option>
                        <option value="Electrónica">Electrónica</option>
                        <option value="Cómputo">Cómputo</option>
                    </select>
                    <select class="filter-select" id="estadoFilter">
                        <option value="all">Todos los estados</option>
                        <option value="disponible">Disponible</option>
                        <option value="no_disponible">No Disponible</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="product-grid" id="productGrid" style="display: none;">
                <!-- Los equipos se cargarán dinámicamente aquí con JS -->
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/inventario.js"></script>
</body>
</html>
