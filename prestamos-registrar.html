<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Préstamo - LabTrack</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 600px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-flask"></i>
                    </div>
                    <span>LabTrack</span>
                </div>
            </div>
            
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <h4 id="nombreUsuario">Cargando...</h4>
                    <p id="correoUsuario">cargando@itsr.edu.mx</p>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <i class="fas fa-tachometer-alt menu-item-icon"></i>
                    <span class="menu-item-text">Dashboard</span>
                </a>
                <a href="inventario.html" class="menu-item">
                    <i class="fas fa-boxes menu-item-icon"></i>
                    <span class="menu-item-text">Inventario</span>
                </a>
                <a href="prestamos.html" class="menu-item active">
                    <i class="fas fa-hand-holding menu-item-icon"></i>
                    <span class="menu-item-text">Préstamos</span>
                </a>
                <a href="mantenimiento.html" class="menu-item">
                    <i class="fas fa-tools menu-item-icon"></i>
                    <span class="menu-item-text">Mantenimiento</span>
                </a>
                <a href="catalogo.html" class="menu-item">
                    <i class="fas fa-store menu-item-icon"></i>
                    <span class="menu-item-text">Ver Catálogo</span>
                </a>
                <a href="configuracion-admin.html" class="menu-item">
                    <i class="fas fa-cog menu-item-icon"></i>
                    <span class="menu-item-text">Configuración</span>
                </a>
                <a href="#" class="menu-item" style="margin-top: 50px; color: var(--danger);" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt menu-item-icon"></i>
                    <span class="menu-item-text">Cerrar Sesión</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Nuevo Préstamo</h1>
                    <p class="page-subtitle">Asigna un equipo del inventario a un usuario</p>
                </div>
                <button class="btn btn-outline" onclick="window.location.href='prestamos.html'">
                    <i class="fas fa-arrow-left"></i> Volver a Préstamos
                </button>
            </div>

            <div id="alerta" style="max-width: 600px;"></div>

            <div id="spinner" style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-green);"></i>
                <p style="margin-top: 15px; color: var(--text-light);">Cargando usuarios y equipos...</p>
            </div>

            <div class="form-container" id="formContainer" style="display: none;">
                <form id="registroPrestamoForm" onsubmit="event.preventDefault(); registrarPrestamo()">
                    
                    <div class="form-group">
                        <label class="form-label" for="selectUsuario">Usuario (Estudiante / Docente)</label>
                        <div style="position: relative;">
                            <i class="fas fa-user-graduate form-input-icon"></i>
                            <select class="form-input" id="selectUsuario" required>
                                <option value="" disabled selected>Selecciona un usuario...</option>
                                <!-- Opciones cargadas dinámicamente -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="selectEquipo">Equipo a prestar</label>
                        <div style="position: relative;">
                            <i class="fas fa-microchip form-input-icon"></i>
                            <select class="form-input" id="selectEquipo" required>
                                <option value="" disabled selected>Selecciona un equipo...</option>
                                <!-- Opciones cargadas dinámicamente -->
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" id="btnGuardar" style="width: 100%; margin-top: 20px;">
                        <i class="fas fa-hand-holding"></i> Confirmar Préstamo
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/prestamos-registrar.js"></script>
</body>
</html>
